<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module">
  import { animate, scroll } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm"
</script>
    <style>
@import url("https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap");

        *{
            margin:0;
            padding: 0;
        }
        body{
            font-family: "Roboto", sans-serif;
  text-transform: uppercase;
        }
        .row{
            display: grid;
            grid-template-columns: repeat(3,2fr);
            gap: 30px;
            justify-content: center;
            /* width: 100%; */
        }

        .col{
            height: 25rem;
            width: 70%;
            border-radius: 20px;
            background-color: bisque;
            padding:50px ;
            padding-top: 15px;
            transition: all 0.3s ease;
            
        }
        .col:hover{
            box-shadow: 8px 8px 1px 1px;
            /* z-index: 20; */
            /* padding: 20px; */
            /* border-bottom: 20px; */
            /* height: 26rem 20rem; */
            transform: scale(1.1,1.1);
        }
        img{
            height: 50vh;
            width: 100%;
            border-radius:30px   ;
        }
        h1{
            text-align: center;
            font-weight: 900;
            color:darkgreen;
            font-size: 2rem;
        }
        a{
            text-decoration: none;
            color:darkgreen;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
        }
        .table{
            border: 10px;

        }
        .textsp{
            letter-spacing: 10px;
        }
    </style>
</head>
<body style="padding-top: 50px; padding:50px ;">
    
    <div id="pokemon" class="row"></div>
    
    <script src="./script.js"></script>
</body>
</html>
